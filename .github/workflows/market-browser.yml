name: Tradeify real TradingView and CSP
on:
  push:
    branches: [mejoras-v2-2026-11-18]
    paths: ['worker/security-headers.ts','worker/cloudflare.ts','lib/market-widgets.ts','lib/validation.ts','lib/journal.ts','package.json','package-lock.json','components/journal/markets.tsx','tests/check-market-browser.mjs','.github/workflows/market-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-markets-v2
  cancel-in-progress: true
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/tradeify-browser" --ignore-scripts playwright@1.62.1
      - run: '"$RUNNER_TEMP/tradeify-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: npm run build:cloudflare
        env:
          TRADEIFY_D1_ID: 11111111-1111-4111-8111-111111111111
          TRADEIFY_R2_BUCKET: tradeify-local-test
      - run: node tests/check-market-browser.mjs
        env:
          TRADEIFY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/tradeify-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-markets-${{ github.sha }}
          path: outputs/market-browser
          retention-days: 14
